<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For You ❤️</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  font-family:Arial, sans-serif;
  background:
    radial-gradient(circle at top, #44215f 0%, #1b102a 45%, #09050f 100%);
  color:white;
}

.bg-glow{
  position:fixed;
  width:420px;
  height:420px;
  border-radius:50%;
  background:rgba(255,80,170,.18);
  filter:blur(90px);
  animation:moveGlow 7s ease-in-out infinite alternate;
}

@keyframes moveGlow{
  from{
    transform:translate(-120px,-90px);
  }
  to{
    transform:translate(130px,100px);
  }
}

.card{
  width:min(90%,430px);
  min-height:430px;
  padding:35px 25px;
  border-radius:28px;
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.15);
  backdrop-filter:blur(14px);
  box-shadow:
    0 0 40px rgba(255,79,163,.17),
    inset 0 0 25px rgba(255,255,255,.03);
  text-align:center;
  position:relative;
  z-index:10;
  animation:cardIn 1s ease;
}

@keyframes cardIn{
  from{
    opacity:0;
    transform:translateY(25px) scale(.95);
  }
  to{
    opacity:1;
    transform:translateY(0) scale(1);
  }
}

.heart-main{
  font-size:70px;
  animation:heartbeat 1.2s infinite;
  filter:drop-shadow(0 0 14px #ff4fa3);
}

@keyframes heartbeat{
  0%,100%{transform:scale(1)}
  25%{transform:scale(1.15)}
  45%{transform:scale(1)}
  65%{transform:scale(1.1)}
}

h1{
  margin-top:12px;
  font-size:30px;
}

.name{
  background:linear-gradient(90deg,#ff7bbb,#ffd3e9);
  -webkit-background-clip:text;
  color:transparent;
}

.message-box{
  margin-top:28px;
  min-height:105px;
  display:flex;
  align-items:center;
  justify-content:center;
}

#message{
  font-size:20px;
  line-height:1.6;
  color:#ffe9f4;
}

.cursor{
  display:inline-block;
  margin-left:3px;
  animation:blink .7s infinite;
}

@keyframes blink{
  50%{opacity:0}
}

button{
  margin-top:28px;
  border:none;
  outline:none;
  padding:14px 24px;
  border-radius:30px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
  color:white;
  background:linear-gradient(135deg,#ff4f9b,#a64dff);
  box-shadow:0 8px 25px rgba(255,79,155,.35);
  transition:.25s;
}

button:hover{
  transform:translateY(-3px) scale(1.04);
}

button:active{
  transform:scale(.96);
}

.small{
  margin-top:24px;
  opacity:.6;
  font-size:13px;
}

.floating-heart{
  position:fixed;
  bottom:-40px;
  pointer-events:none;
  animation:floatUp linear forwards;
  z-index:1;
}

@keyframes floatUp{
  0%{
    transform:translateY(0) rotate(0deg);
    opacity:0;
  }
  15%{
    opacity:.9;
  }
  100%{
    transform:translateY(-115vh) rotate(360deg);
    opacity:0;
  }
}

.spark{
  position:fixed;
  width:5px;
  height:5px;
  background:white;
  border-radius:50%;
  box-shadow:0 0 8px white;
  animation:sparkle 2.5s infinite ease-in-out;
  opacity:.5;
}

@keyframes sparkle{
  0%,100%{
    transform:scale(.4);
    opacity:.2;
  }
  50%{
    transform:scale(1.5);
    opacity:1;
  }
}

.final-text{
  font-size:28px !important;
  font-weight:bold;
  background:linear-gradient(90deg,#ff6caf,#fff,#bd7bff);
  -webkit-background-clip:text;
  color:transparent !important;
}
</style>
</head>

<body>

<div class="bg-glow"></div>

<div class="card">
  <div class="heart-main">💗</div>

  <h1>For <span class="name">You</span></h1>

  <div class="message-box">
    <div id="message"></div>
  </div>

  <button onclick="nextMessage()">Next Message 💌</button>

  <div class="small">Made with a little too much love 😭❤️</div>
</div>

<script>

const messages = [
  "Shaam se raat ho gayi tumse baat karte karte...",
  "Aur finally tumne woh chhota sa 'haan' bol hi diya 😭❤️",
  "Sach kahu, us ek word ne mera pura mood bana diya.",
  "Mujhe tum perfect nahi chahiye...",
  "Bas tum jaisi ho, waise hi pasand ho.",
  "Tumhari ek notification bhi smile kara deti hai.",
  "Aur ab tum officially meri favourite person ho 🥹💗",
  "No pressure, no fake promises...",
  "Bas trust, care aur ek cute sa connection.",
  "Thank you for saying YES ❤️"
];

let index = 0;
let typing = false;

function typeText(text){

  typing = true;

  const el = document.getElementById("message");

  el.classList.remove("final-text");
  el.innerHTML = "";

  let i = 0;

  const interval = setInterval(()=>{

    el.innerHTML =
      text.substring(0,i) +
      '<span class="cursor">|</span>';

    i++;

    if(i > text.length){

      clearInterval(interval);

      el.innerHTML = text;

      if(index === messages.length){
        el.classList.add("final-text");
      }

      typing = false;
    }

  },40);
}

function nextMessage(){

  if(typing) return;

  if(index < messages.length){

    typeText(messages[index]);
    index++;

  }else{

    index = 0;
    typeText("Okay... ek baar aur dekh lo 😭💗");
  }
}

function createHeart(){

  const heart = document.createElement("div");

  heart.className = "floating-heart";

  const hearts = ["❤️","💗","💕","💖","💞","🌸"];

  heart.innerText =
    hearts[Math.floor(Math.random()*hearts.length)];

  heart.style.left =
    Math.random()*100 + "vw";

  heart.style.fontSize =
    (15 + Math.random()*25) + "px";

  heart.style.animationDuration =
    (4 + Math.random()*5) + "s";

  document.body.appendChild(heart);

  setTimeout(()=>{
    heart.remove();
  },9000);
}

setInterval(createHeart,500);

for(let i=0;i<30;i++){

  const star = document.createElement("div");

  star.className = "spark";

  star.style.left =
    Math.random()*100 + "vw";

  star.style.top =
    Math.random()*100 + "vh";

  star.style.animationDelay =
    Math.random()*3 + "s";

  document.body.appendChild(star);
}

setTimeout(()=>{
  typeText("Heyy... ye chhota sa page sirf tumhare liye hai 🥹❤️");
},700);

</script>

</body>
</html>
